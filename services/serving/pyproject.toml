[project]
name = "serving"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "aioboto3>=13.0",
    "duckdb>=1.0",
    "pytz>=2024.1",
    "analytics-platform-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serving"]
